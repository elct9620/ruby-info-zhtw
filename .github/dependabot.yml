version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 5
    groups:
      ai-sdk:
        patterns:
          - 'ai'
          - '@ai-sdk/*'
      langfuse:
        patterns:
          - '@langfuse/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 5
